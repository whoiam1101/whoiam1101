name: Metrics & Snake

on:
  # Schedule daily update at midnight UTC
  schedule:
    - cron: "0 0 * * *"
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:
  # Run on push to main to initialize on setup
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create dist directory
        run: mkdir -p dist

      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: whoiam1101
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Yerevan
          output_action: none
          filename: github-metrics.svg

          # Languages breakdown plugin (works reliably with standard GITHUB_TOKEN)
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

      - name: Copy metrics to dist
        run: |
          if [ -f "github-metrics.svg" ]; then
            cp github-metrics.svg dist/github-metrics.svg
          fi

      - name: Generate Contribution Snake
        uses: Platane/snk@v3
        with:
          github_user_name: whoiam1101
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy All Assets to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
